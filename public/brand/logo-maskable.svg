<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ink" x1="138" y1="400" x2="392" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="ring" x1="42" y1="0" x2="470" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAFAFA" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#E0F2FE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="a1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(96 84) scale(300)">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(470 190) scale(240)">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a3" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 500) scale(300)">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <path d="M42 268 A214 64 0 0 0 470 268" transform="rotate(-16 256 268)" fill="none" stroke="#000000" stroke-width="28"/>
    </mask>
    <clipPath id="tile"><rect width="512" height="512"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#09090B"/>
    <rect width="512" height="512" fill="url(#a1)"/>
    <rect width="512" height="512" fill="url(#a2)"/>
    <rect width="512" height="512" fill="url(#a3)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>

    <g transform="translate(256 256) scale(0.74) translate(-256 -262)">
    <!-- sparkles -->
    <path d="M408 76 Q408 92 424 92 Q408 92 408 108 Q408 92 392 92 Q408 92 408 76Z" fill="#FFFFFF" opacity="0.85"/>
    <path d="M96 197 Q96 206 105 206 Q96 206 96 215 Q96 206 87 206 Q96 206 96 197Z" fill="#FFFFFF" opacity="0.55"/>
    <path d="M440 413 Q440 420 447 420 Q440 420 440 427 Q440 420 433 420 Q440 420 440 413Z" fill="#FFFFFF" opacity="0.4"/>

    <g transform="rotate(-16 256 268)">
      <!-- back half of the orbit -->
      <path d="M42 268 A214 64 0 0 1 470 268" fill="none" stroke="#FAFAFA" stroke-opacity="0.16" stroke-width="9"/>
    </g>

    <g mask="url(#cut)">
    <!-- monogram glow -->
    <g filter="url(#soft)" opacity="0.55">
      <path d="M138 396 L252 124 L252 396 M252 124 H300 C360 124 392 160 392 208 C392 256 360 292 300 292 H252"
            fill="none" stroke="url(#ink)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- monogram: A and P share one stem -->
    <path d="M138 396 L252 124 L252 396 M252 124 H300 C360 124 392 160 392 208 C392 256 360 292 300 292 H252"
          fill="none" stroke="url(#ink)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="rotate(-16 256 268)">
      <!-- front half of the orbit, cut into the letters -->
      <path d="M42 268 A214 64 0 0 0 470 268" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round"/>
      <!-- the satellite: matches the site's pulsing status dot -->
      <circle cx="431" cy="305" r="34" fill="#10B981" opacity="0.55" filter="url(#glow)"/>
      <circle cx="431" cy="305" r="17" fill="#10B981"/>
      <circle cx="431" cy="305" r="7" fill="#ECFDF5"/>
    </g>
    </g>
  </g>
  </svg>
